- name: mysql configuration
  hosts: mysql
  become: yes
  tasks:
  - name: install mysql-server
    ansible.builtin.dnf:
      name: mysql-server
      state: present

  - name: setup password
    ansible.builtin.command: mysql_secure_installation --set-root-pass RoboShop@1  

  - name: enable ans start the service
    ansible.builtin.service:
      name: mysqld
      state: restarted
      enabled: yes   