- name: payment configuration
  hosts: payment
  become: yes
  tasks:
  - name: python3 gcc python3-devel
    ansible.builtin.dnf:
      name: "{{ item }}"
    loop:
    - python3 
    - gcc 
    - python3-devel
  - name: creating the system user 
    ansible.builtin.user:
      name: system 
      home: app
      shell: /sbin/nologin
      comment: "roboshop system user"

  - name: deleting the app directory
    ansible.builtin.file:
      path: /app
      state: absent

  -  name: creating the app directory
     ansible.builtin.file:
      path: /app
      state: directory  

  - name: delete the payment zip file
    ansible.builtin.file:
      path: /tmp/payment.zip
      state: absent

  - name: download the payment zip file
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
      dest: /tmp/payment.zip

  - name: unarchive zip file 
    ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app  
      remote_src: yes  

  - name: installing dependices
    ansible.builtin.pip:
      requirements: requirements.txt 
      executable: pip3.9 
    args:
      chdir: /app
  - name: copying the systemctl services
    ansible.builtin.template:
      src: payment.service
      dest: /etc/systemd/system/payment.service

  - name: system demonreload
    ansible.builtin.systemd_service:
      daemon-reload: yes
  - name: start and enable the payment service
    ansible.builtin.service:
      name: payment
      state: restarted
      enabled: yes      
